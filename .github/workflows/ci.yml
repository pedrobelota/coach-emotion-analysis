name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install lightweight test dependencies
        run: python -m pip install -e ".[dev,demo,demo-test]"
      - name: Lint
        run: python -m ruff check .
      - name: Formatting
        run: python -m ruff format --check .
      - name: Unit tests (no model imports or downloads)
        run: python -m pytest
      - name: Demo HTTP boundary (synthetic input, no models)
        run: python -m pytest tests/integration/test_demo_api.py
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Media integration (synthetic input)
        run: python -m pytest tests/integration/test_media.py
      - name: Build distribution
        run: python -m build
      - name: Verify installed wheel and CLI
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          coach-emotion --help
          coach-emotion evaluate --predictions examples/synthetic_predictions.csv --ground-truth examples/synthetic_ground_truth.tsv
      - name: Audit publishable files
        run: python scripts/audit_release.py

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare allowlisted Space sources
        run: python scripts/prepare_space.py --output outputs/hf-space
      - name: Build Docker Space
        run: docker build --tag coach-emotion-demo outputs/hf-space
      - name: Check running container without downloading models
        shell: bash
        run: |
          docker run -d --name demo -p 127.0.0.1:7860:7860 coach-emotion-demo
          trap 'docker logs demo; docker stop demo' EXIT
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1:7860/api/health
          curl --fail http://127.0.0.1:7860/static/app.js --output /dev/null
          curl --fail http://127.0.0.1:7860/api/example
