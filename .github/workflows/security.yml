name: Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks with checksum verification
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan complete reachable history (redacted)
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact --no-banner'

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install current CPU inference environment
        run: |
          python -m pip install --upgrade pip==26.2.2 setuptools==84.2.1
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[inference,demo,dev,demo-test]" pip-audit==2.10.1
          python -m pip check
      - name: Check model adapter without downloading weights
        run: python -m pytest tests/integration/test_ser_compat.py tests/integration/test_demo_api.py
      - name: Audit installed runtime and tooling dependencies
        run: |
          python -m pip list --format=json > "$RUNNER_TEMP/packages.json"
          python -c 'import json, os, pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"]); packages=json.loads((p/"packages.json").read_text()); (p/"audit.txt").write_text("\n".join(x["name"]+"=="+x["version"].split("+")[0] for x in packages if x["name"]!="coach-emotion-analysis"))'
          python -m pip_audit -r "$RUNNER_TEMP/audit.txt" --no-deps --disable-pip
